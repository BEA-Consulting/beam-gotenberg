<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Free substitutes for Microsoft's Aptos family, which isn't installed (its licence doesn't allow
  redistribution). Without these, LibreOffice falls back to a serif font for Aptos text.

  None of these is metric-compatible with Aptos (no free metric clone exists), so they were chosen
  on measured widths, preferring slightly narrower so text doesn't wrap onto extra lines or pages:
    Aptos (and Display, Light, SemiBold, ...) -> Carlito (Calibri's metrics; about 4% narrower)
    Aptos Narrow (Excel's default)              -> Roboto Condensed (within 1% of Aptos Narrow's widths,
                                                   so cells and numbers fit as they do in Excel)
    Aptos Serif                                 -> Caladea (Cambria's metrics)
    Aptos Mono                                  -> Liberation Mono
-->
<fontconfig>

  <match target="pattern">
    <test name="family"><string>Aptos</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Aptos Display</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Aptos Light</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Aptos SemiBold</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Aptos ExtraBold</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Aptos Black</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Aptos Narrow</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Roboto Condensed</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Aptos Serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Caladea</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Aptos Mono</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Mono</string></edit>
  </match>

</fontconfig>
